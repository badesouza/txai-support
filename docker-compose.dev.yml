# =============================================================================
# Development Docker Compose - Services Only
# =============================================================================
# Runs infrastructure services (PostgreSQL, WPPConnect, Redis)
# while frontend and backend run locally with hot reload.
#
# Usage:
#   npm run dev:services
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: txai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-txai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-txai_secret}
      POSTGRES_DB: ${POSTGRES_DB:-txai_support}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - txai-dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-txai} -d ${POSTGRES_DB:-txai_support}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: txai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - txai-dev-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  wppconnect-server:
    image: wppconnect/server-cli:latest
    platform: ${WPPCONNECT_PLATFORM:-linux/amd64}
    container_name: txai-wppconnect-server
    restart: unless-stopped
    shm_size: '2gb'
    ports:
      - "21465:21465"
    command:
      - --secretKey
      - ${WPPCONNECT_SECRET_KEY:-THISISMYSECURETOKEN}
      - --port
      - "21465"
    environment:
      PORT: 21465
      SECRET_KEY: ${WPPCONNECT_SECRET_KEY:-THISISMYSECURETOKEN}
      TZ: America/Sao_Paulo
    volumes:
      - wppconnect_data:/usr/src/wpp-server/userDataDir
    networks:
      - txai-dev-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:21465/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  wppconnect_data:
    driver: local

networks:
  txai-dev-network:
    driver: bridge
