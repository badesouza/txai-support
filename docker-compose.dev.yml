# version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: txai-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: txai_support_dev
      POSTGRES_USER: txai_user
      POSTGRES_PASSWORD: txai_password
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    networks:
      - txai-dev-network

  # Backend - Development
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: txai-backend-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: "postgresql://txai_user:txai_password@postgres:5432/txai_support_dev?schema=public"
      JWT_SECRET: "dev-jwt-secret"
      PORT: 3001
      # WPPConnect Server
      WPPCONNECT_URL: http://wppconnect:21465
      WPPCONNECT_SESSION: txai-whatsapp
      WPPCONNECT_SECRET_KEY: THISISMYSECURETOKEN
      BACKEND_URL: http://backend:3001
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/uploads:/app/uploads
      - /tmp/chromium-temp:/tmp/chromium-temp
    ports:
      - "3001:3001"
    depends_on:
      - postgres
    networks:
      - txai-dev-network
    command: npm run dev

  # WPPConnect Server
  wppconnect:
    image: wppconnect/server-cli
    container_name: txai-wppconnect-dev
    restart: unless-stopped
    environment:
      - SECRET_KEY=THISISMYSECURETOKEN
      - LOG_LEVEL=DEBUG
      - WEBHOOK_URL=http://backend:3001/api/whatsapp/webhook
      - WEBHOOK_GLOBAL_URL=http://backend:3001/api/whatsapp/webhook
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=true
      - CONFIG_SESSION_PHONE_CLIENT=txai-whatsapp
      - CONFIG_SESSION_PHONE_NAME=TXAI Support
      - CONFIG_AUTHENTICATION_TYPE=none
    volumes:
      - wppconnect_tokens:/root/.wppconnect-server/tokens
      - wppconnect_sessions:/root/.wppconnect-server/sessions
    ports:
      - "21465:21465"
    networks:
      - txai-dev-network
    depends_on:
      - backend

  # Frontend - Development
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile.dev
    container_name: txai-frontend-dev
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    networks:
      - txai-dev-network
    command: npm start

volumes:
  postgres_dev_data:
    driver: local
  wppconnect_tokens:
    driver: local
  wppconnect_sessions:
    driver: local

networks:
  txai-dev-network:
    driver: bridge
