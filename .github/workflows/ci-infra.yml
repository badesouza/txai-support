name: CI Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/ci-infra.yml'
  pull_request:
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/ci-infra.yml'

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: ci-infra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.6

      - name: Check formatting
        run: tofu fmt -check -recursive
        working-directory: infra/terraform

  validate:
    name: Validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev]
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.6

      - name: Initialize (no backend)
        run: tofu init -backend=false
        working-directory: infra/terraform/environments/${{ matrix.environment }}

      - name: Validate configuration
        run: tofu validate
        working-directory: infra/terraform/environments/${{ matrix.environment }}

  plan:
    name: Plan (${{ matrix.environment }})
    if: github.event_name == 'pull_request'
    needs: [format, validate]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev]
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.6

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_TF_SERVICE_ACCOUNT }}

      - name: Initialize Terraform
        run: |
          tofu init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="prefix=terraform/${{ matrix.environment }}"
        working-directory: infra/terraform/environments/${{ matrix.environment }}

      - name: Plan
        id: plan
        run: |
          tofu plan \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="region=${{ vars.GCP_REGION || 'us-central1' }}" \
            -no-color \
            -out=tfplan 2>&1 | tee plan_output.txt
          echo "plan<<EOF" >> $GITHUB_OUTPUT
          cat plan_output.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        working-directory: infra/terraform/environments/${{ matrix.environment }}

      - name: Comment PR with Plan
        uses: actions/github-script@v7
        with:
          script: |
            const plan = `${{ steps.plan.outputs.plan }}`;
            const truncatedPlan = plan.length > 60000 
              ? plan.substring(0, 60000) + '\n\n... (truncated)'
              : plan;
            
            const body = `## Terraform Plan: \`${{ matrix.environment }}\`
            
            <details>
            <summary>Click to expand plan output</summary>
            
            \`\`\`hcl
            ${truncatedPlan}
            \`\`\`
            
            </details>
            
            *Triggered by @${{ github.actor }} on \`${{ github.event.pull_request.head.ref }}\`*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

