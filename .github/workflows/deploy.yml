name: Deploy

on:
  # Auto-deploy to dev on push to main
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'infra/terraform/**'
      - 'scripts/gcp/**'
      - 'wppconnect/**'
      - '.github/actions/**'
      - '.github/workflows/deploy.yml'
  # Manual deployment for all environments
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - stg
          - prd
      components:
        description: 'Components to deploy'
        required: true
        default: 'backend-frontend'
        type: choice
        options:
          - all
          - infra
          - backend
          - frontend
          - infra-backend
          - backend-frontend
      wppconnect_mode:
        description: 'How to handle WPPConnect during deployment'
        required: true
        default: 'skip'
        type: choice
        options:
          - skip
          - redeploy_latest_no_build
          - rebuild_and_redeploy
      ref:
        description: 'Branch, tag, or commit SHA to deploy'
        required: true
        default: 'main'
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && (inputs.environment || 'dev') || 'dev' }}
  cancel-in-progress: ${{ (github.event_name == 'workflow_dispatch' && (inputs.environment || 'dev') == 'dev') || github.event_name == 'push' }}

env:
  TOFU_VERSION: '1.8.6'
  NODE_VERSION: '20'

jobs:
  # Determine deployment parameters
  determine-deployment:
    name: Determine Deployment Parameters
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.params.outputs.environment }}
      components: ${{ steps.params.outputs.components }}
      wppconnect_mode: ${{ steps.params.outputs.wppconnect_mode }}
      ref: ${{ steps.params.outputs.ref }}
      duration_seconds: ${{ steps.job_timer.outputs.duration_seconds }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for git diff

      - name: Start timer
        id: timer_start
        run: echo "epoch=$(date +%s)" >> $GITHUB_OUTPUT
      
      - name: Set deployment parameters
        id: params
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # Manual deployment - use inputs
            echo "environment=${{ inputs.environment }}" >> $GITHUB_OUTPUT
            echo "components=${{ inputs.components }}" >> $GITHUB_OUTPUT
            echo "wppconnect_mode=${{ inputs.wppconnect_mode }}" >> $GITHUB_OUTPUT
            echo "ref=${{ inputs.ref }}" >> $GITHUB_OUTPUT
          else
            # Auto-deployment on push to main
            echo "environment=dev" >> $GITHUB_OUTPUT
            echo "ref=${{ github.sha }}" >> $GITHUB_OUTPUT
            
            # Determine components based on changed files
            CHANGED_FILES="$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})"
            COMPONENTS=""
            WPP_MODE="skip"

            if echo "$CHANGED_FILES" | grep -q "^infra/terraform/"; then
              COMPONENTS="${COMPONENTS}infra,"
            fi
            if echo "$CHANGED_FILES" | grep -q "^backend/"; then
              COMPONENTS="${COMPONENTS}backend,"
            fi
            if echo "$CHANGED_FILES" | grep -q "^frontend/"; then
              COMPONENTS="${COMPONENTS}frontend,"
            fi

            if echo "$CHANGED_FILES" | grep -Eq "^(wppconnect/|scripts/gcp/deploy-wppconnect\.sh)"; then
              WPP_MODE="rebuild_and_redeploy"
            elif echo "$CHANGED_FILES" | grep -Eq "^infra/terraform/.*/scripts/wppconnect-vm-startup\.sh$"; then
              WPP_MODE="redeploy_latest_no_build"
            fi
            
            # Default to backend-frontend if no specific changes detected
            if [ -z "$COMPONENTS" ]; then
              COMPONENTS="backend-frontend"
            else
              # Remove trailing comma and format
              COMPONENTS=$(echo "$COMPONENTS" | sed 's/,$//')
              # Convert to standard format
              if [[ "$COMPONENTS" == *"infra"* ]] && [[ "$COMPONENTS" == *"backend"* ]] && [[ "$COMPONENTS" == *"frontend"* ]]; then
                COMPONENTS="all"
              elif [[ "$COMPONENTS" == *"infra"* ]] && [[ "$COMPONENTS" == *"backend"* ]]; then
                COMPONENTS="infra-backend"
              elif [[ "$COMPONENTS" == *"backend"* ]] && [[ "$COMPONENTS" == *"frontend"* ]]; then
                COMPONENTS="backend-frontend"
              fi
            fi
            
            echo "components=${COMPONENTS}" >> $GITHUB_OUTPUT
            echo "wppconnect_mode=${WPP_MODE}" >> $GITHUB_OUTPUT
          fi

      - name: Record duration
        if: always()
        id: job_timer
        run: echo "duration_seconds=$(( $(date +%s) - ${{ steps.timer_start.outputs.epoch }} ))" >> $GITHUB_OUTPUT

  # ============================================
  # INFRASTRUCTURE DEPLOYMENT
  # ============================================
  deploy-infra:
    name: Deploy Infrastructure
    needs: [determine-deployment]
    if: contains(fromJSON('["all", "infra", "infra-backend"]'), needs.determine-deployment.outputs.components)
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-deployment.outputs.environment }}
    outputs:
      backend_url: ${{ steps.outputs.outputs.backend_url }}
      backend_service_name: ${{ steps.outputs.outputs.backend_service_name }}
      artifact_repo_url: ${{ steps.outputs.outputs.artifact_repo_url }}
      wppconnect_url: ${{ steps.outputs.outputs.wppconnect_url }}
      wppconnect_fqdn: ${{ steps.outputs.outputs.wppconnect_fqdn }}
      wppconnect_vm_name: ${{ steps.outputs.outputs.wppconnect_vm_name }}
      wppconnect_vm_zone: ${{ steps.outputs.outputs.wppconnect_vm_zone }}
      wppconnect_artifact_repo_url: ${{ steps.outputs.outputs.wppconnect_artifact_repo_url }}
      duration_seconds: ${{ steps.job_timer.outputs.duration_seconds }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.determine-deployment.outputs.ref }}

      - name: Start timer
        id: timer_start
        run: echo "epoch=$(date +%s)" >> $GITHUB_OUTPUT

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_TF_SERVICE_ACCOUNT }}

      - uses: ./.github/actions/setup-tofu-cache
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          lockfile: infra/terraform/environments/${{ needs.determine-deployment.outputs.environment }}/.terraform.lock.hcl

      - name: Initialize Terraform
        run: |
          tofu init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="prefix=txai-support/${{ needs.determine-deployment.outputs.environment }}"
        working-directory: infra/terraform/environments/${{ needs.determine-deployment.outputs.environment }}

      - name: Apply Infrastructure
        run: |
          tofu apply -auto-approve \
            -input=false \
            -lock-timeout=2h \
            -parallelism=20 \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="region=${{ vars.GCP_REGION || 'us-central1' }}"
        working-directory: infra/terraform/environments/${{ needs.determine-deployment.outputs.environment }}

      - name: Extract Outputs
        id: outputs
        run: |
          echo "backend_url=$(tofu output -raw backend_cloud_run_url)" >> $GITHUB_OUTPUT
          echo "backend_service_name=$(tofu output -raw backend_service_name)" >> $GITHUB_OUTPUT
          echo "artifact_repo_url=$(tofu output -raw artifact_repo_url)" >> $GITHUB_OUTPUT
          echo "wppconnect_url=$(tofu output -raw wppconnect_base_url)" >> $GITHUB_OUTPUT
          echo "wppconnect_fqdn=$(tofu output -raw wppconnect_fqdn)" >> $GITHUB_OUTPUT
          echo "wppconnect_vm_name=$(tofu output -raw wppconnect_vm_name)" >> $GITHUB_OUTPUT
          echo "wppconnect_vm_zone=$(tofu output -raw wppconnect_vm_zone)" >> $GITHUB_OUTPUT
          echo "wppconnect_artifact_repo_url=$(tofu output -raw wppconnect_artifact_repo_url)" >> $GITHUB_OUTPUT
        working-directory: infra/terraform/environments/${{ needs.determine-deployment.outputs.environment }}

      - name: Record duration
        if: always()
        id: job_timer
        run: echo "duration_seconds=$(( $(date +%s) - ${{ steps.timer_start.outputs.epoch }} ))" >> $GITHUB_OUTPUT

  # ============================================
  # WPPCONNECT DEPLOYMENT
  # ============================================
  deploy-wppconnect:
    name: Deploy WPPConnect
    needs: [determine-deployment, deploy-infra]
    if: |
      always() &&
      needs.determine-deployment.outputs.wppconnect_mode != 'skip' &&
      (needs.deploy-infra.result == 'success' || needs.deploy-infra.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-deployment.outputs.environment }}
    outputs:
      duration_seconds: ${{ steps.job_timer.outputs.duration_seconds }}
      deploy_mode: ${{ steps.deploy.outputs.deploy_mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.determine-deployment.outputs.ref }}

      - name: Start timer
        id: timer_start
        run: echo "epoch=$(date +%s)" >> $GITHUB_OUTPUT

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_TF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - uses: ./.github/actions/setup-tofu-cache
        if: needs.deploy-infra.outputs.wppconnect_artifact_repo_url == ''
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          lockfile: infra/terraform/environments/${{ needs.determine-deployment.outputs.environment }}/.terraform.lock.hcl

      - name: Get Terraform Outputs
        id: tf-outputs
        run: |
          if [ -n "${{ needs.deploy-infra.outputs.wppconnect_artifact_repo_url }}" ]; then
            echo "wppconnect_artifact_repo_url=${{ needs.deploy-infra.outputs.wppconnect_artifact_repo_url }}" >> $GITHUB_OUTPUT
            echo "wppconnect_fqdn=${{ needs.deploy-infra.outputs.wppconnect_fqdn }}" >> $GITHUB_OUTPUT
            echo "wppconnect_vm_name=${{ needs.deploy-infra.outputs.wppconnect_vm_name }}" >> $GITHUB_OUTPUT
            echo "wppconnect_vm_zone=${{ needs.deploy-infra.outputs.wppconnect_vm_zone }}" >> $GITHUB_OUTPUT
          else
            cd infra/terraform/environments/${{ needs.determine-deployment.outputs.environment }}
            tofu init \
              -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
              -backend-config="prefix=txai-support/${{ needs.determine-deployment.outputs.environment }}"
            echo "wppconnect_artifact_repo_url=$(tofu output -raw wppconnect_artifact_repo_url)" >> $GITHUB_OUTPUT
            echo "wppconnect_fqdn=$(tofu output -raw wppconnect_fqdn)" >> $GITHUB_OUTPUT
            echo "wppconnect_vm_name=$(tofu output -raw wppconnect_vm_name)" >> $GITHUB_OUTPUT
            echo "wppconnect_vm_zone=$(tofu output -raw wppconnect_vm_zone)" >> $GITHUB_OUTPUT
          fi

      - name: Deploy WPPConnect
        id: deploy
        run: |
          case "${{ needs.determine-deployment.outputs.wppconnect_mode }}" in
            redeploy_latest_no_build)
              DEPLOY_MODE="latest-no-build"
              FORCE_REBUILD="false"
              ;;
            rebuild_and_redeploy)
              DEPLOY_MODE="rebuild"
              FORCE_REBUILD="true"
              ;;
            *)
              echo "Unsupported wppconnect_mode: ${{ needs.determine-deployment.outputs.wppconnect_mode }}"
              exit 1
              ;;
          esac

          export PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}"
          export REGION="${{ vars.GCP_REGION || 'us-central1' }}"
          export WPPCONNECT_AR_REPO="$(echo "${{ steps.tf-outputs.outputs.wppconnect_artifact_repo_url }}" | awk -F'/' '{print $3}')"
          export WPPCONNECT_VM_NAME="${{ steps.tf-outputs.outputs.wppconnect_vm_name }}"
          export WPPCONNECT_VM_ZONE="${{ steps.tf-outputs.outputs.wppconnect_vm_zone }}"
          export WPPCONNECT_FQDN="${{ steps.tf-outputs.outputs.wppconnect_fqdn }}"
          export WPPCONNECT_DEPLOY_MODE="${DEPLOY_MODE}"
          export FORCE_WPPCONNECT_REBUILD="${FORCE_REBUILD}"

          ./scripts/gcp/deploy-wppconnect.sh

          echo "deploy_mode=${DEPLOY_MODE}" >> $GITHUB_OUTPUT

      - name: Record duration
        if: always()
        id: job_timer
        run: echo "duration_seconds=$(( $(date +%s) - ${{ steps.timer_start.outputs.epoch }} ))" >> $GITHUB_OUTPUT

  # ============================================
  # BACKEND DEPLOYMENT
  # ============================================
  deploy-backend:
    name: Deploy Backend
    needs: [determine-deployment, deploy-infra, deploy-wppconnect]
    # Run even if deploy-infra was skipped
    if: |
      always() && 
      contains(fromJSON('["all", "backend", "infra-backend", "backend-frontend"]'), needs.determine-deployment.outputs.components) &&
      (needs.deploy-infra.result == 'success' || needs.deploy-infra.result == 'skipped') &&
      (needs.deploy-wppconnect.result == 'success' || needs.deploy-wppconnect.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-deployment.outputs.environment }}
    outputs:
      backend_url: ${{ steps.deploy.outputs.backend_url }}
      duration_seconds: ${{ steps.job_timer.outputs.duration_seconds }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.determine-deployment.outputs.ref }}

      - name: Start timer
        id: timer_start
        run: echo "epoch=$(date +%s)" >> $GITHUB_OUTPUT

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_TF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - uses: ./.github/actions/setup-tofu-cache
        if: needs.deploy-infra.outputs.backend_url == ''
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          lockfile: infra/terraform/environments/${{ needs.determine-deployment.outputs.environment }}/.terraform.lock.hcl

      - name: Get Terraform Outputs
        id: tf-outputs
        run: |
          # If infra was deployed, use those outputs; otherwise fetch from state
          if [ -n "${{ needs.deploy-infra.outputs.backend_url }}" ]; then
            echo "backend_url=${{ needs.deploy-infra.outputs.backend_url }}" >> $GITHUB_OUTPUT
            echo "backend_service_name=${{ needs.deploy-infra.outputs.backend_service_name }}" >> $GITHUB_OUTPUT
            echo "artifact_repo_url=${{ needs.deploy-infra.outputs.artifact_repo_url }}" >> $GITHUB_OUTPUT
            echo "wppconnect_url=${{ needs.deploy-infra.outputs.wppconnect_url }}" >> $GITHUB_OUTPUT
          else
            # Fetch from existing Terraform state
            cd infra/terraform/environments/${{ needs.determine-deployment.outputs.environment }}
            tofu init \
              -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
              -backend-config="prefix=txai-support/${{ needs.determine-deployment.outputs.environment }}"
            echo "backend_url=$(tofu output -raw backend_cloud_run_url)" >> $GITHUB_OUTPUT
            echo "backend_service_name=$(tofu output -raw backend_service_name)" >> $GITHUB_OUTPUT
            echo "artifact_repo_url=$(tofu output -raw artifact_repo_url)" >> $GITHUB_OUTPUT
            echo "wppconnect_url=$(tofu output -raw wppconnect_base_url)" >> $GITHUB_OUTPUT
          fi
      - name: Configure Docker for Artifact Registry
        run: |
          REGION="${{ vars.GCP_REGION || 'us-central1' }}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and Push Container
        id: build
        run: |
          PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}"
          REGION="${{ vars.GCP_REGION || 'us-central1' }}"
          AR_REPO="txai-support"
          IMAGE_NAME="txai-backend"
          IMAGE_TAG="${{ needs.determine-deployment.outputs.ref }}-$(date +%Y%m%d%H%M%S)"
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/${IMAGE_NAME}:${IMAGE_TAG}"
          IMAGE_LATEST="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/${IMAGE_NAME}:latest"
          
          echo "Building image: ${IMAGE_URI}"
          docker build -t "${IMAGE_URI}" -t "${IMAGE_LATEST}" ./backend
          
          echo "Pushing image..."
          docker push "${IMAGE_URI}"
          docker push "${IMAGE_LATEST}"
          
          echo "image_uri=${IMAGE_URI}" >> $GITHUB_OUTPUT

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          SERVICE_NAME="${{ steps.tf-outputs.outputs.backend_service_name }}"
          REGION="${{ vars.GCP_REGION || 'us-central1' }}"
          WPPCONNECT_URL="${{ steps.tf-outputs.outputs.wppconnect_url }}"
          BACKEND_URL="${{ steps.tf-outputs.outputs.backend_url }}"
          
          # Derive Firebase project ID and CORS origins
          FIREBASE_PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}"
          CORS_ORIGINS="https://${FIREBASE_PROJECT_ID}.web.app,https://${FIREBASE_PROJECT_ID}.firebaseapp.com"
          
          gcloud run services update "${SERVICE_NAME}" \
            --image "${{ steps.build.outputs.image_uri }}" \
            --region "${REGION}" \
            --update-env-vars="^;^CORS_ORIGINS=${CORS_ORIGINS}" \
            --update-env-vars="^;^PUBLIC_BASE_URL=${BACKEND_URL}" \
            --update-env-vars="^;^WPPCONNECT_BASE_URL=${WPPCONNECT_URL}"
          
          echo "backend_url=${BACKEND_URL}" >> $GITHUB_OUTPUT

      - name: Wait for Backend Health
        run: |
          BACKEND_URL="${{ steps.deploy.outputs.backend_url }}"
          echo "Waiting for backend at ${BACKEND_URL}/api/health..."
          
          for i in {1..30}; do
            if curl -sf "${BACKEND_URL}/api/health" > /dev/null 2>&1; then
              echo "Backend is healthy!"
              exit 0
            fi
            echo "Attempt ${i}/30 - waiting..."
            sleep 10
          done
          
          echo "Warning: Backend health check timed out"
          exit 0  # Don't fail the workflow

      - name: Record duration
        if: always()
        id: job_timer
        run: echo "duration_seconds=$(( $(date +%s) - ${{ steps.timer_start.outputs.epoch }} ))" >> $GITHUB_OUTPUT

  # ============================================
  # FRONTEND DEPLOYMENT
  # ============================================
  deploy-frontend:
    name: Deploy Frontend
    if: |
      always() &&
      contains(fromJSON('["all", "frontend", "backend-frontend"]'), needs.determine-deployment.outputs.components) &&
      (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped')
    needs: [determine-deployment, deploy-infra, deploy-backend]
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-deployment.outputs.environment }}
    outputs:
      duration_seconds: ${{ steps.job_timer.outputs.duration_seconds }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.determine-deployment.outputs.ref }}

      - name: Start timer
        id: timer_start
        run: echo "epoch=$(date +%s)" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_TF_SERVICE_ACCOUNT }}

      - uses: ./.github/actions/setup-tofu-cache
        if: needs.deploy-backend.outputs.backend_url == '' && needs.deploy-infra.outputs.backend_url == ''
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          lockfile: infra/terraform/environments/${{ needs.determine-deployment.outputs.environment }}/.terraform.lock.hcl

      - name: Get Backend URL
        id: backend-url
        run: |
          # Use output from backend deploy if available
          if [ -n "${{ needs.deploy-backend.outputs.backend_url }}" ]; then
            echo "url=${{ needs.deploy-backend.outputs.backend_url }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ needs.deploy-infra.outputs.backend_url }}" ]; then
            echo "url=${{ needs.deploy-infra.outputs.backend_url }}" >> $GITHUB_OUTPUT
          else
            # Fetch from Terraform state
            cd infra/terraform/environments/${{ needs.determine-deployment.outputs.environment }}
            tofu init \
              -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
              -backend-config="prefix=txai-support/${{ needs.determine-deployment.outputs.environment }}"
            echo "url=$(tofu output -raw backend_cloud_run_url)" >> $GITHUB_OUTPUT
          fi

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: frontend

      - name: Build Frontend
        run: npm run build
        working-directory: frontend
        env:
          REACT_APP_API_URL: ${{ steps.backend-url.outputs.url }}/api

      - name: Deploy Firestore Indexes
        run: npx firebase deploy --only firestore:indexes --project "${{ secrets.GCP_PROJECT_ID }}" --token "${{ secrets.FIREBASE_TOKEN }}"

      - name: Deploy to Firebase Hosting
        run: npx firebase deploy --only hosting --project "${{ secrets.GCP_PROJECT_ID }}" --token "${{ secrets.FIREBASE_TOKEN }}"

      - name: Record duration
        if: always()
        id: job_timer
        run: echo "duration_seconds=$(( $(date +%s) - ${{ steps.timer_start.outputs.epoch }} ))" >> $GITHUB_OUTPUT

  # ============================================
  # SUMMARY
  # ============================================
  summary:
    name: Deployment Summary
    if: always()
    needs: [determine-deployment, deploy-infra, deploy-wppconnect, deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Print Summary
        run: |
          format_duration() {
            local total="${1:-}"
            if [ -z "${total}" ]; then
              echo "skipped"
              return
            fi

            local minutes=$(( total / 60 ))
            local seconds=$(( total % 60 ))
            printf "%sm %ss" "${minutes}" "${seconds}"
          }

          value_or_zero() {
            local value="${1:-}"
            if [ -z "${value}" ]; then
              echo "0"
            else
              echo "${value}"
            fi
          }

          TOTAL_SECONDS=$(( \
            $(value_or_zero "${{ needs.determine-deployment.outputs.duration_seconds }}") + \
            $(value_or_zero "${{ needs.deploy-infra.outputs.duration_seconds }}") + \
            $(value_or_zero "${{ needs.deploy-wppconnect.outputs.duration_seconds }}") + \
            $(value_or_zero "${{ needs.deploy-backend.outputs.duration_seconds }}") + \
            $(value_or_zero "${{ needs.deploy-frontend.outputs.duration_seconds }}") \
          ))

          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status | Approx. Duration |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|------------------|" >> $GITHUB_STEP_SUMMARY
          echo "| Determine deployment | ${{ needs.determine-deployment.result || 'skipped' }} | $(format_duration "${{ needs.determine-deployment.outputs.duration_seconds }}") |" >> $GITHUB_STEP_SUMMARY
          echo "| Infrastructure | ${{ needs.deploy-infra.result || 'skipped' }} | $(format_duration "${{ needs.deploy-infra.outputs.duration_seconds }}") |" >> $GITHUB_STEP_SUMMARY
          echo "| WPPConnect | ${{ needs.deploy-wppconnect.result || 'skipped' }} | $(format_duration "${{ needs.deploy-wppconnect.outputs.duration_seconds }}") |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | ${{ needs.deploy-backend.result || 'skipped' }} | $(format_duration "${{ needs.deploy-backend.outputs.duration_seconds }}") |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ needs.deploy-frontend.result || 'skipped' }} | $(format_duration "${{ needs.deploy-frontend.outputs.duration_seconds }}") |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** \`${{ needs.determine-deployment.outputs.environment }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Ref:** \`${{ needs.determine-deployment.outputs.ref }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Components:** \`${{ needs.determine-deployment.outputs.components }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**WPPConnect mode:** \`${{ needs.determine-deployment.outputs.wppconnect_mode }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Approx. total duration:** \`$(format_duration "${TOTAL_SECONDS}")\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

