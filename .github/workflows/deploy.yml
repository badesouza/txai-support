name: Deploy

on:
  # Auto-deploy to dev on push to main
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'infra/terraform/**'
      - '.github/workflows/deploy.yml'
  # Manual deployment for all environments
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - stg
          - prd
      components:
        description: 'Components to deploy'
        required: true
        default: 'backend-frontend'
        type: choice
        options:
          - all
          - infra
          - backend
          - frontend
          - infra-backend
          - backend-frontend
      ref:
        description: 'Branch, tag, or commit SHA to deploy'
        required: true
        default: 'main'
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && (inputs.environment || 'dev') || 'dev' }}
  cancel-in-progress: ${{ (github.event_name == 'workflow_dispatch' && (inputs.environment || 'dev') == 'dev') || github.event_name == 'push' }}

env:
  TOFU_VERSION: '1.8.6'
  NODE_VERSION: '20'

jobs:
  # Determine deployment parameters
  determine-deployment:
    name: Determine Deployment Parameters
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.params.outputs.environment }}
      components: ${{ steps.params.outputs.components }}
      ref: ${{ steps.params.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for git diff
      
      - name: Set deployment parameters
        id: params
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # Manual deployment - use inputs
            echo "environment=${{ inputs.environment }}" >> $GITHUB_OUTPUT
            echo "components=${{ inputs.components }}" >> $GITHUB_OUTPUT
            echo "ref=${{ inputs.ref }}" >> $GITHUB_OUTPUT
          else
            # Auto-deployment on push to main
            echo "environment=dev" >> $GITHUB_OUTPUT
            echo "ref=${{ github.sha }}" >> $GITHUB_OUTPUT
            
            # Determine components based on changed files
            COMPONENTS=""
            if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -q "^infra/terraform/"; then
              COMPONENTS="${COMPONENTS}infra,"
            fi
            if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -q "^backend/"; then
              COMPONENTS="${COMPONENTS}backend,"
            fi
            if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -q "^frontend/"; then
              COMPONENTS="${COMPONENTS}frontend,"
            fi
            
            # Default to backend-frontend if no specific changes detected
            if [ -z "$COMPONENTS" ]; then
              COMPONENTS="backend-frontend"
            else
              # Remove trailing comma and format
              COMPONENTS=$(echo "$COMPONENTS" | sed 's/,$//')
              # Convert to standard format
              if [[ "$COMPONENTS" == *"infra"* ]] && [[ "$COMPONENTS" == *"backend"* ]] && [[ "$COMPONENTS" == *"frontend"* ]]; then
                COMPONENTS="all"
              elif [[ "$COMPONENTS" == *"infra"* ]] && [[ "$COMPONENTS" == *"backend"* ]]; then
                COMPONENTS="infra-backend"
              elif [[ "$COMPONENTS" == *"backend"* ]] && [[ "$COMPONENTS" == *"frontend"* ]]; then
                COMPONENTS="backend-frontend"
              fi
            fi
            
            echo "components=${COMPONENTS}" >> $GITHUB_OUTPUT
          fi

  # ============================================
  # INFRASTRUCTURE DEPLOYMENT
  # ============================================
  deploy-infra:
    name: Deploy Infrastructure
    needs: [determine-deployment]
    if: contains(fromJSON('["all", "infra", "infra-backend"]'), needs.determine-deployment.outputs.components)
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-deployment.outputs.environment }}
    outputs:
      backend_url: ${{ steps.outputs.outputs.backend_url }}
      backend_service_name: ${{ steps.outputs.outputs.backend_service_name }}
      artifact_repo_url: ${{ steps.outputs.outputs.artifact_repo_url }}
      wppconnect_url: ${{ steps.outputs.outputs.wppconnect_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.determine-deployment.outputs.ref }}

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_TF_SERVICE_ACCOUNT }}

      - name: Enable Tofu plugin cache
        run: |
          mkdir -p "$HOME/.terraform.d/plugin-cache"
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> $GITHUB_ENV

      - name: Cache Tofu plugins
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-tofu-${{ hashFiles(format('infra/terraform/environments/{0}/.terraform.lock.hcl', needs.determine-deployment.outputs.environment)) }}
          restore-keys: |
            ${{ runner.os }}-tofu-

      - name: Initialize Terraform
        run: |
          tofu init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="prefix=terraform/${{ needs.determine-deployment.outputs.environment }}"
        working-directory: infra/terraform/environments/${{ needs.determine-deployment.outputs.environment }}

      - name: Apply Infrastructure
        run: |
          tofu apply -auto-approve \
            -input=false \
            -lock-timeout=30m \
            -parallelism=20 \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="region=${{ vars.GCP_REGION || 'us-central1' }}" \
            -var="redis_enabled=false"
        working-directory: infra/terraform/environments/${{ needs.determine-deployment.outputs.environment }}

      - name: Extract Outputs
        id: outputs
        run: |
          echo "backend_url=$(tofu output -raw backend_cloud_run_url)" >> $GITHUB_OUTPUT
          echo "backend_service_name=$(tofu output -raw backend_service_name)" >> $GITHUB_OUTPUT
          echo "artifact_repo_url=$(tofu output -raw artifact_repo_url)" >> $GITHUB_OUTPUT
          echo "wppconnect_url=$(tofu output -raw wppconnect_base_url)" >> $GITHUB_OUTPUT
        working-directory: infra/terraform/environments/${{ needs.determine-deployment.outputs.environment }}

  # ============================================
  # BACKEND DEPLOYMENT
  # ============================================
  deploy-backend:
    name: Deploy Backend
    needs: [determine-deployment, deploy-infra]
    # Run even if deploy-infra was skipped
    if: |
      always() && 
      contains(fromJSON('["all", "backend", "infra-backend", "backend-frontend"]'), needs.determine-deployment.outputs.components) &&
      (needs.deploy-infra.result == 'success' || needs.deploy-infra.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-deployment.outputs.environment }}
    outputs:
      backend_url: ${{ steps.deploy.outputs.backend_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.determine-deployment.outputs.ref }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_TF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: Get Terraform Outputs
        id: tf-outputs
        run: |
          # If infra was deployed, use those outputs; otherwise fetch from state
          if [ -n "${{ needs.deploy-infra.outputs.backend_url }}" ]; then
            echo "backend_url=${{ needs.deploy-infra.outputs.backend_url }}" >> $GITHUB_OUTPUT
            echo "backend_service_name=${{ needs.deploy-infra.outputs.backend_service_name }}" >> $GITHUB_OUTPUT
            echo "artifact_repo_url=${{ needs.deploy-infra.outputs.artifact_repo_url }}" >> $GITHUB_OUTPUT
            echo "wppconnect_url=${{ needs.deploy-infra.outputs.wppconnect_url }}" >> $GITHUB_OUTPUT
          else
            # Fetch from existing Terraform state
            cd infra/terraform/environments/${{ needs.determine-deployment.outputs.environment }}
            tofu init \
              -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
              -backend-config="prefix=terraform/${{ needs.determine-deployment.outputs.environment }}"
            echo "backend_url=$(tofu output -raw backend_cloud_run_url)" >> $GITHUB_OUTPUT
            echo "backend_service_name=$(tofu output -raw backend_service_name)" >> $GITHUB_OUTPUT
            echo "artifact_repo_url=$(tofu output -raw artifact_repo_url)" >> $GITHUB_OUTPUT
            echo "wppconnect_url=$(tofu output -raw wppconnect_base_url)" >> $GITHUB_OUTPUT
          fi
        env:
          TOFU_VERSION: ${{ env.TOFU_VERSION }}

      - name: Configure Docker for Artifact Registry
        run: |
          REGION="${{ vars.GCP_REGION || 'us-central1' }}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and Push Container
        id: build
        run: |
          PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}"
          REGION="${{ vars.GCP_REGION || 'us-central1' }}"
          AR_REPO="txai-support"
          IMAGE_NAME="txai-backend"
          IMAGE_TAG="${{ needs.determine-deployment.outputs.ref }}-$(date +%Y%m%d%H%M%S)"
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/${IMAGE_NAME}:${IMAGE_TAG}"
          IMAGE_LATEST="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/${IMAGE_NAME}:latest"
          
          echo "Building image: ${IMAGE_URI}"
          gcloud builds submit --tag "${IMAGE_URI}" ./backend
          
          # Tag as latest
          gcloud artifacts docker tags add "${IMAGE_URI}" "${IMAGE_LATEST}" 2>/dev/null || true
          
          echo "image_uri=${IMAGE_URI}" >> $GITHUB_OUTPUT

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          SERVICE_NAME="${{ steps.tf-outputs.outputs.backend_service_name }}"
          REGION="${{ vars.GCP_REGION || 'us-central1' }}"
          WPPCONNECT_URL="${{ steps.tf-outputs.outputs.wppconnect_url }}"
          BACKEND_URL="${{ steps.tf-outputs.outputs.backend_url }}"
          
          # Derive Firebase project ID and CORS origins
          FIREBASE_PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}"
          CORS_ORIGINS="https://${FIREBASE_PROJECT_ID}.web.app,https://${FIREBASE_PROJECT_ID}.firebaseapp.com"
          
          gcloud run services update "${SERVICE_NAME}" \
            --image "${{ steps.build.outputs.image_uri }}" \
            --region "${REGION}" \
            --update-env-vars="^;^CORS_ORIGINS=${CORS_ORIGINS}" \
            --update-env-vars="^;^PUBLIC_BASE_URL=${BACKEND_URL}" \
            --update-env-vars="^;^WPPCONNECT_BASE_URL=${WPPCONNECT_URL}"
          
          echo "backend_url=${BACKEND_URL}" >> $GITHUB_OUTPUT

      - name: Wait for Backend Health
        run: |
          BACKEND_URL="${{ steps.deploy.outputs.backend_url }}"
          echo "Waiting for backend at ${BACKEND_URL}/api/health..."
          
          for i in {1..30}; do
            if curl -sf "${BACKEND_URL}/api/health" > /dev/null 2>&1; then
              echo "Backend is healthy!"
              exit 0
            fi
            echo "Attempt ${i}/30 - waiting..."
            sleep 10
          done
          
          echo "Warning: Backend health check timed out"
          exit 0  # Don't fail the workflow

  # ============================================
  # FRONTEND DEPLOYMENT
  # ============================================
  deploy-frontend:
    name: Deploy Frontend
    if: |
      always() &&
      contains(fromJSON('["all", "frontend", "backend-frontend"]'), needs.determine-deployment.outputs.components) &&
      (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped')
    needs: [determine-deployment, deploy-infra, deploy-backend]
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-deployment.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.determine-deployment.outputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_TF_SERVICE_ACCOUNT }}

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: Get Backend URL
        id: backend-url
        run: |
          # Use output from backend deploy if available
          if [ -n "${{ needs.deploy-backend.outputs.backend_url }}" ]; then
            echo "url=${{ needs.deploy-backend.outputs.backend_url }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ needs.deploy-infra.outputs.backend_url }}" ]; then
            echo "url=${{ needs.deploy-infra.outputs.backend_url }}" >> $GITHUB_OUTPUT
          else
            # Fetch from Terraform state
            cd infra/terraform/environments/${{ needs.determine-deployment.outputs.environment }}
            tofu init \
              -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
              -backend-config="prefix=terraform/${{ needs.determine-deployment.outputs.environment }}"
            echo "url=$(tofu output -raw backend_cloud_run_url)" >> $GITHUB_OUTPUT
          fi

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: frontend

      - name: Build Frontend
        run: npm run build
        working-directory: frontend
        env:
          REACT_APP_API_URL: ${{ steps.backend-url.outputs.url }}/api

      - name: Deploy Firestore Indexes
        run: npx firebase deploy --only firestore:indexes --project "${{ secrets.GCP_PROJECT_ID }}" --token "${{ secrets.FIREBASE_TOKEN }}"

      - name: Deploy to Firebase Hosting
        run: npx firebase deploy --only hosting --project "${{ secrets.GCP_PROJECT_ID }}" --token "${{ secrets.FIREBASE_TOKEN }}"

  # ============================================
  # SUMMARY
  # ============================================
  summary:
    name: Deployment Summary
    if: always()
    needs: [deploy-infra, deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Print Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Infrastructure | ${{ needs.deploy-infra.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | ${{ needs.deploy-backend.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ needs.deploy-frontend.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** \`${{ needs.determine-deployment.outputs.environment }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Ref:** \`${{ needs.determine-deployment.outputs.ref }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Components:** \`${{ needs.determine-deployment.outputs.components }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

