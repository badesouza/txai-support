version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: txai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: txai_support
      POSTGRES_USER: txai_user
      POSTGRES_PASSWORD: txai_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - txai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U txai_user -d txai_support"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend - Node.js + Prisma
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: txai-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://txai_user:txai_password@postgres:5432/txai_support?schema=public"
      JWT_SECRET: "your-super-secret-jwt-key-change-in-production"
      PORT: 3001
      # WhatsApp/Chromium
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
      CHROME_BIN: /usr/bin/chromium-browser
      CHROME_PATH: /usr/bin/chromium-browser
      DISPLAY: :99
    volumes:
      - ./backend/uploads:/app/uploads
      - /tmp/chromium-temp:/tmp/chromium-temp
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - txai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend - React
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: txai-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - txai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx - Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: txai-nginx
    restart: unless-stopped
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    networks:
      - txai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local

networks:
  txai-network:
    driver: bridge
