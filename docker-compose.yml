services:
  # =============================================================================
  # Firebase Emulator Suite (Firestore, Auth)
  # =============================================================================
  firebase-emulator:
    image: andreysenov/firebase-tools:latest
    container_name: txai-firebase-emulator
    restart: unless-stopped
    ports:
      - "4000:4000"   # Emulator UI
      - "8082:8082"   # Firestore (host:8082 -> container:8082)
      - "9099:9099"   # Auth
      - "9199:9199"   # Storage (if needed)
      - "9150:9150"
    volumes:
      - ./firebase.json:/home/node/firebase.json:ro
      - ./firestore.rules:/home/node/firestore.rules:ro
      - ./firestore.indexes.json:/home/node/firestore.indexes.json:ro
      - firebase_data:/home/node/.cache/firebase/emulators
    command: firebase emulators:start --only firestore,auth --project local-dev
    networks:
      - txai-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # =============================================================================
  # Redis - for WhatsApp sessions and caching
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: txai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - txai-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # =============================================================================
  # GCS Emulator - https://github.com/fsouza/fake-gcs-server
  # Bucket is auto-created via mounted directory structure
  # =============================================================================
  fake-gcs:
    image: fsouza/fake-gcs-server:latest
    container_name: txai-fake-gcs
    restart: unless-stopped
    ports:
      - "4443:4443"
    volumes:
      # Mount with pre-created bucket directory - fake-gcs recognizes subdirs as buckets
      - ./data/gcs:/data
    command:
      - "-scheme=http"
      - "-port=4443"
      - "-external-url=http://localhost:4443"
      - "-public-host=localhost:4443"
    networks:
      - txai-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4443/storage/v1/b"]
      interval: 10s
      timeout: 5s
      retries: 3

  # =============================================================================
  # WPPConnect Server - WhatsApp API (separate container)
  # Image: https://hub.docker.com/r/wppconnect/server-cli
  # Docs:  https://wppconnect.io/docs/wppconnect-server/
  # =============================================================================
  wppconnect-server:
    image: wppconnect/server-cli:latest
    container_name: txai-wppconnect-server
    restart: unless-stopped
    ports:
      - "21465:21465"
    command: ["--config", "/usr/src/wpp-server/config.json"]
    environment:
      # NOTE: WPPConnect-Server uses a configured secret key to generate tokens.
      # We pass it via env here; if the image expects a config file instead,
      # we will mount a config in a follow-up commit.
      PORT: 21465
      SECRET_KEY: ${WPPCONNECT_SECRET_KEY:-THISISMYSECURETOKEN}
      TZ: America/Sao_Paulo
    volumes:
      - ./wppconnect/config.json:/usr/src/wpp-server/config.json:ro
      # Persist session data (WhatsApp auth state)
      - wppconnect_data:/usr/src/wpp-server/userDataDir
    networks:
      - txai-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:21465/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # =============================================================================
  # Backend Node.js API
  # =============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: txai-backend
    restart: unless-stopped
    # Increase shared memory for Chromium/Puppeteer (default 64MB is too small)
    shm_size: '2gb'
    environment:
      NODE_ENV: production
      PORT: 3001
      TZ: America/Sao_Paulo
      # Firestore Emulator (port 8080 inside container)
      FIRESTORE_EMULATOR_HOST: firebase-emulator:8082
      FIREBASE_AUTH_EMULATOR_HOST: firebase-emulator:9099
      GCP_PROJECT_ID: local-dev
      # Redis
      REDIS_URL: redis://redis:6379
      # Storage (GCS with emulator)
      STORAGE_DRIVER: gcs
      STORAGE_EMULATOR_HOST: http://fake-gcs:4443
      GCS_BUCKET: txai-uploads
      GCS_PROJECT_ID: local-dev
      GCS_PUBLIC_HOST: http://localhost:4443
      GCS_UPLOADS_PREFIX: uploads
      # WhatsApp (sessions stored in Redis, no filesystem)
      WHATSAPP_TOKEN_STORE: redis
      # WhatsApp driver (direct vs wppconnect-server)
      WHATSAPP_DRIVER: server
      WPPCONNECT_BASE_URL: http://wppconnect-server:21465
      WPPCONNECT_SESSION: txai-whatsapp
      WPPCONNECT_SECRET_KEY: ${WPPCONNECT_SECRET_KEY:-THISISMYSECURETOKEN}
      WPPCONNECT_WEBHOOK_SECRET: ${WPPCONNECT_WEBHOOK_SECRET:-txai-webhook-secret}
      # JWT & CORS
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key}
      CORS_ORIGINS: http://localhost:3000,http://localhost:8081
      # Seeding (password from .env file - NOT committed)
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:-admin123}
    ports:
      - "3001:3001"
    # No volume mounts needed - all state is external:
    # - Files → GCS (via STORAGE_DRIVER=gcs)
    # - WhatsApp sessions → Redis (via WHATSAPP_TOKEN_STORE=redis)
    depends_on:
      firebase-emulator:
        condition: service_healthy
      redis:
        condition: service_healthy
      fake-gcs:
        condition: service_healthy
      wppconnect-server:
        condition: service_healthy
    networks:
      - txai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================================================
  # Frontend React App (nginx)
  # =============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://localhost:3001/api
    container_name: txai-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - txai-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  firebase_data:
    driver: local
  redis_data:
    driver: local
  wppconnect_data:
    driver: local

networks:
  txai-network:
    driver: bridge
