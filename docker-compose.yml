version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: txai-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-txai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-txai123}
      POSTGRES_DB: ${POSTGRES_DB:-txai_support}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - txai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U txai"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Node.js API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: txai-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-txai}:${POSTGRES_PASSWORD:-txai123}@postgres:5432/${POSTGRES_DB:-txai_support}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key}
      # WPPConnect direct mode: no external server
    ports:
      - "3001:3001"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/whatsapp-sessions:/app/whatsapp-sessions
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - txai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: txai-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      REACT_APP_API_URL: /api
    depends_on:
      - backend
    networks:
      - txai-network

  # WPPConnect removed; backend runs WPPConnect directly

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: txai-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - frontend
      - backend
    networks:
      - txai-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local

networks:
  txai-network:
    driver: bridge
