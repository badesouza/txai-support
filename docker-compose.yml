services:
  # =============================================================================
  # PostgreSQL Database
  # =============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: txai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-txai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-txai_secret}
      POSTGRES_DB: ${POSTGRES_DB:-txai_support}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - txai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-txai} -d ${POSTGRES_DB:-txai_support}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # =============================================================================
  # Redis - for WhatsApp sessions and caching
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: txai-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - txai-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # =============================================================================
  # WPPConnect Server - WhatsApp API
  # =============================================================================
  wppconnect-server:
    image: wppconnect/server-cli:latest
    platform: ${WPPCONNECT_PLATFORM:-linux/amd64}
    container_name: txai-wppconnect-server
    restart: unless-stopped
    shm_size: '2gb'
    ports:
      - "127.0.0.1:21465:21465"
    command:
      - --secretKey
      - ${WPPCONNECT_SECRET_KEY:-THISISMYSECURETOKEN}
      - --port
      - "21465"
    environment:
      PORT: 21465
      SECRET_KEY: ${WPPCONNECT_SECRET_KEY:-THISISMYSECURETOKEN}
      TZ: America/Sao_Paulo
    volumes:
      - wppconnect_data:/usr/src/wpp-server/userDataDir
    networks:
      - txai-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:21465/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # =============================================================================
  # Backend Node.js API
  # =============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: txai-backend
    restart: unless-stopped
    shm_size: '2gb'
    environment:
      NODE_ENV: production
      PORT: 3001
      TZ: America/Sao_Paulo
      DATABASE_URL: postgresql://${POSTGRES_USER:-txai}:${POSTGRES_PASSWORD:-txai_secret}@postgres:5432/${POSTGRES_DB:-txai_support}
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: local
      UPLOADS_DIR: /app/uploads
      UPLOADS_PREFIX: uploads
      WHATSAPP_TOKEN_STORE: redis
      WHATSAPP_DRIVER: server
      WPPCONNECT_BASE_URL: http://wppconnect-server:21465
      WPPCONNECT_SESSION: txai-whatsapp
      WPPCONNECT_SECRET_KEY: ${WPPCONNECT_SECRET_KEY:-THISISMYSECURETOKEN}
      WPPCONNECT_WEBHOOK_SECRET: ${WPPCONNECT_WEBHOOK_SECRET:-txai-webhook-secret}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3001}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key}
      CORS_ORIGINS: http://localhost:3000,http://localhost:8081,${PUBLIC_FRONTEND_URL:-http://localhost:8081}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:-admin123}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      wppconnect-server:
        condition: service_healthy
    networks:
      - txai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================================================
  # Frontend React App (nginx)
  # =============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${PUBLIC_BASE_URL:-http://localhost:3001}/api
    container_name: txai-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - txai-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  wppconnect_data:
    driver: local
  uploads_data:
    driver: local

networks:
  txai-network:
    driver: bridge
