services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: txai-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-txai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-txai123}
      POSTGRES_DB: ${POSTGRES_DB:-txai_support}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - txai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U txai -d ${POSTGRES_DB:-txai_support}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Node.js API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: txai-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      TZ: America/Sao_Paulo
      DATABASE_URL: postgresql://${POSTGRES_USER:-txai}:${POSTGRES_PASSWORD:-txai123}@postgres:5432/${POSTGRES_DB:-txai_support}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key}
      CORS_ORIGINS: http://localhost:3000,http://localhost:8080
    ports:
      - "3001:3001"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/whatsapp-sessions:/app/whatsapp-sessions
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - txai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend React App (nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://localhost:3001/api
    container_name: txai-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - txai-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local

networks:
  txai-network:
    driver: bridge
